<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#0F5327" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCFCE7" />
      <stop offset="50%" stop-color="#86EFAC" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Ring with glow -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#22C55E" stroke-width="3" opacity="0.4" />
  <circle cx="100" cy="100" r="84" fill="url(#bgGrad)" stroke="#86EFAC" stroke-width="4" filter="url(#glow)" />
  
  <!-- Inner Rim -->
  <circle cx="100" cy="100" r="72" fill="#0B2315" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="66" fill="none" stroke="#16A34A" stroke-dasharray="3,3" stroke-width="1.5" opacity="0.7" />

  <!-- Stylized GT Monogram -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- G -->
    <path d="M 94 65 C 65 65 58 84 58 100 C 58 116 67 135 94 135 C 110 135 116 122 116 112 L 92 112" />
    <!-- T crossbar and stem -->
    <path d="M 108 65 L 142 65" />
    <path d="M 125 65 L 125 135" />
  </g>

  <!-- Sparkle dots -->
  <circle cx="100" cy="42" r="3" fill="#86EFAC" />
  <circle cx="100" cy="158" r="3" fill="#86EFAC" />
  <circle cx="42" cy="100" r="3" fill="#86EFAC" />
  <circle cx="158" cy="100" r="3" fill="#86EFAC" />
</svg>
