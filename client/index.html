<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gt-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#051B0D" />
    <meta name="description" content="GT Mining — Mine virtual GT coins every 4 hours, build your referral network, track your wallet, and explore community updates on a modern Web3 platform." />
    <title>GT Mining — Virtual Coin & Referral Network</title>
    
    <!-- Instant Asset Preloading for 0ms Zero-Delay Display -->
    <link rel="preload" as="image" href="/gt-header-logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/onboarding/story_1.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/onboarding/story_2.jpg" />
    <link rel="preload" as="image" href="/onboarding/story_3.jpg" />
    <link rel="preload" as="image" href="/onboarding/story_4.png" />
    <link rel="preload" as="image" href="/onboarding/story_5.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      * {
        font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      @keyframes floatLogo {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.9); opacity: 0.8; }
        100% { transform: scale(1.35); opacity: 0; }
      }
      @keyframes initProgress {
        0% { width: 0%; }
        100% { width: 100%; }
      }
    </style>
  </head>
  <body class="bg-[#051B0D] text-[#0A341B] antialiased min-h-screen m-0 p-0">
    <div id="root">
      <!-- Instant 0ms First-Paint Splash Screen (Replaced automatically by React on mount) -->
      <div id="initial-splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px;background:radial-gradient(circle at 50% 30%, #0A2E18 0%, #051B0D 60%, #04160A 100%);color:#fff;user-select:none;">
        <div style="width:100%;display:flex;justify-content:flex-end;padding-top:16px;">
          <span style="font-size:12px;font-weight:700;color:#a3a3a3;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);">Skip ›</span>
        </div>
        
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto 0;">
          <div style="position:relative;width:110px;height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
            <div style="position:absolute;width:130px;height:130px;border-radius:50%;border:1px solid rgba(34,197,94,0.3);animation:pulseRing 2s infinite ease-out;"></div>
            <img src="/gt-header-logo.png" alt="GT Mining Logo" style="width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 10px 30px rgba(34,197,94,0.6));animation:floatLogo 2.5s infinite ease-in-out;" />
          </div>
          
          <h1 style="font-size:28px;font-weight:900;letter-spacing:-0.5px;color:#ffffff;margin:0 0 8px 0;">
            GT MINING <span style="color:#22C55E;">NETWORK</span>
          </h1>
          <p style="font-size:11px;font-weight:600;color:#86EFAC;letter-spacing:1.5px;text-transform:uppercase;margin:0;font-family:monospace;">
            Autonomous Decentralized Cloud Protocol
          </p>
        </div>

        <div style="width:100%;max-width:280px;padding-bottom:24px;">
          <div style="display:flex;justify-content:space-between;font-size:11px;font-family:monospace;color:#a3a3a3;margin-bottom:8px;">
            <span>INITIALIZING NODE...</span>
            <span style="color:#22C55E;font-weight:700;">ACTIVE</span>
          </div>
          <div style="width:100%;height:6px;border-radius:999px;background:rgba(255,255,255,0.1);overflow:hidden;">
            <div style="width:100%;height:100%;border-radius:999px;background:linear-gradient(90deg, #16A34A, #22C55E);box-shadow:0 0 12px #22C55E;animation:initProgress 0.8s ease-out forwards;"></div>
          </div>
          <p style="font-size:10px;text-align:center;color:rgba(163,163,163,0.8);margin-top:10px;">
            Tap anywhere to continue
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
